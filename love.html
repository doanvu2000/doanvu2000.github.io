<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: "Poppins", sans-serif;
    }

    canvas {
      position: absolute;
      width: 100%; height: 100%;
      cursor: crosshair;
    }

    body {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }

    /* Love text */
    .content {
      position: relative;
      pointer-events: none;
      user-select: none;
    }

    .content h2 {
      color: #fff;
      font-size: 8em;
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: 600;
    }

    .content h2:nth-child(1) {
      color: transparent;
      -webkit-text-stroke: 2px #FFC0CB;
    }

    .content h2:nth-child(2) {
      color: #FFC0CB;
      animation: wave 4s ease-in-out infinite;
    }

    @keyframes wave {
      0%, 100% {
        clip-path: polygon(0% 45%, 16% 44%, 33% 50%, 54% 60%, 70% 61%, 84% 59%, 100% 52%, 100% 100%, 0% 100%);
      }
      50% {
        clip-path: polygon(0% 60%, 15% 65%, 34% 66%, 51% 62%, 67% 50%, 84% 45%, 100% 46%, 100% 100%, 0% 100%);
      }
    }

    /* Pause overlay */
    #pause-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      color: #FFC0CB;
      font-size: 1.8rem;
      letter-spacing: 0.25em;
      font-weight: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 20;
    }
    #pause-overlay.visible { opacity: 1; }

    /* Hint */
    #hint {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 192, 203, 0.55);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
      transition: opacity 1.2s ease;
    }
    #hint.fade-out { opacity: 0; }
  </style>
</head>
<body>

  <canvas id="pinkboard"></canvas>

  <section>
    <div class="content">
      <h2>Love</h2>
      <h2>Love</h2>
    </div>
  </section>

  <div id="pause-overlay">⏸ &nbsp; PAUSED</div>
  <p id="hint">click · tap to burst &nbsp;·&nbsp; space to pause</p>

  <script>
    const canvas = document.getElementById('pinkboard');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    const settings = {
      particles: { length: 500, duration: 2, velocity: 100, effect: -0.75, size: 30 }
    };

    // Heart colors: 5 pink/red variants
    const COLORS = ['#ea80b0', '#ff6b9d', '#ff4d6d', '#c96a9e', '#ffb3c6'];

    // Point helper
    class Point {
      constructor(x = 0, y = 0) { this.x = x; this.y = y; }
      clone() { return new Point(this.x, this.y); }
      length(len) {
        if (len === undefined) return Math.sqrt(this.x * this.x + this.y * this.y);
        this.normalize();
        this.x *= len; this.y *= len;
        return this;
      }
      normalize() {
        const l = this.length();
        this.x /= l; this.y /= l;
        return this;
      }
    }

    // Parametric heart curve
    function pointOnHeart(t) {
      return new Point(
        160 * Math.pow(Math.sin(t), 3),
        130 * Math.cos(t) - 50 * Math.cos(2 * t) - 20 * Math.cos(3 * t) - 10 * Math.cos(4 * t) + 25
      );
    }

    // Pre-render one heart image per color (avoid per-frame path drawing)
    function createHeartImage(color) {
      const s = settings.particles.size;
      const c = document.createElement('canvas');
      c.width = s; c.height = s;
      const cx = c.getContext('2d');

      function to(t) {
        const p = pointOnHeart(t);
        return new Point(s / 2 + p.x * s / 350, s / 2 - p.y * s / 350);
      }

      // Bake glow into image at creation time — zero cost at render time
      cx.shadowBlur = 7;
      cx.shadowColor = color;
      cx.beginPath();
      let t = -Math.PI;
      let p = to(t);
      cx.moveTo(p.x, p.y);
      while (t < Math.PI) { t += 0.01; p = to(t); cx.lineTo(p.x, p.y); }
      cx.closePath();
      cx.fillStyle = color;
      cx.fill();

      const img = new Image();
      img.src = c.toDataURL();
      return img;
    }

    const heartImages = COLORS.map(createHeartImage);

    // Particle
    class Particle {
      constructor() {
        this.position = new Point();
        this.velocity = new Point();
        this.acceleration = new Point();
        this.age = 0;
        this.colorIndex = 0;
      }

      initialize(x, y, dx, dy) {
        this.position.x = x; this.position.y = y;
        this.velocity.x = dx; this.velocity.y = dy;
        this.acceleration.x = dx * settings.particles.effect;
        this.acceleration.y = dy * settings.particles.effect;
        this.age = 0;
        this.colorIndex = Math.floor(Math.random() * COLORS.length);
      }

      update(dt) {
        this.position.x += this.velocity.x * dt;
        this.position.y += this.velocity.y * dt;
        this.velocity.x += this.acceleration.x * dt;
        this.velocity.y += this.acceleration.y * dt;
        this.age += dt;
      }

      draw(ctx) {
        const ease = t => (--t) * t * t + 1;
        const progress = this.age / settings.particles.duration;
        const size = heartImages[0].width * ease(progress);
        ctx.globalAlpha = 1 - progress;
        ctx.drawImage(heartImages[this.colorIndex],
          this.position.x - size / 2, this.position.y - size / 2, size, size);
      }
    }

    // Circular buffer particle pool
    class ParticlePool {
      constructor(length) {
        this.particles = Array.from({ length }, () => new Particle());
        this.firstActive = 0;
        this.firstFree = 0;
      }

      add(x, y, dx, dy) {
        this.particles[this.firstFree].initialize(x, y, dx, dy);
        if (++this.firstFree >= this.particles.length) this.firstFree = 0;
        if (this.firstActive === this.firstFree) {
          if (++this.firstActive >= this.particles.length) this.firstActive = 0;
        }
      }

      _forEach(fn) {
        const { particles, firstActive, firstFree } = this;
        if (firstActive < firstFree) {
          for (let i = firstActive; i < firstFree; i++) fn(particles[i]);
        } else if (firstFree < firstActive) {
          for (let i = firstActive; i < particles.length; i++) fn(particles[i]);
          for (let i = 0; i < firstFree; i++) fn(particles[i]);
        }
      }

      update(dt) {
        this._forEach(p => p.update(dt));
        while (
          this.particles[this.firstActive].age >= settings.particles.duration &&
          this.firstActive !== this.firstFree
        ) {
          if (++this.firstActive >= this.particles.length) this.firstActive = 0;
        }
      }

      draw(ctx) {
        this._forEach(p => p.draw(ctx));
      }
    }

    const pool = new ParticlePool(settings.particles.length);
    const particleRate = settings.particles.length / settings.particles.duration;
    let time = null;
    let paused = false;

    function onResize() {
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      // setTransform is idempotent — safe to call on every resize
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // Spawn burst of hearts at CSS-pixel coordinates
    function burst(x, y, count = 25) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = settings.particles.velocity * (0.4 + Math.random() * 0.8);
        pool.add(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed);
      }
    }

    // Convert pointer event to canvas CSS-pixel coords
    function canvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const src = e.touches ? e.touches[0] : e;
      return {
        x: (src.clientX - rect.left) * (canvas.clientWidth / rect.width),
        y: (src.clientY - rect.top) * (canvas.clientHeight / rect.height),
      };
    }

    canvas.addEventListener('click', e => {
      const { x, y } = canvasPos(e);
      burst(x, y);
    });

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const { x, y } = canvasPos(e);
      burst(x, y, 18);
    }, { passive: false });

    // Spacebar pause / resume
    const pauseOverlay = document.getElementById('pause-overlay');
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        paused = !paused;
        pauseOverlay.classList.toggle('visible', paused);
        if (!paused) { time = null; render(); }
      }
    });

    // Fade hint after 4 s
    setTimeout(() => document.getElementById('hint').classList.add('fade-out'), 4000);

    function render(ts) {
      if (paused) return;
      requestAnimationFrame(render);

      const now = ts / 1000;
      const dt = time ? Math.min(now - time, 0.05) : 0;
      time = now;

      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      // Emit particles along heart outline
      const amount = particleRate * dt;
      for (let i = 0; i < amount; i++) {
        const pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
        const dir = pos.clone().length(settings.particles.velocity);
        pool.add(w / 2 + pos.x, h / 2 - pos.y, dir.x, -dir.y);
      }

      pool.update(dt);
      pool.draw(ctx);
    }

    window.addEventListener('resize', onResize);

    setTimeout(() => { onResize(); render(); }, 10);
  </script>
</body>
</html>
